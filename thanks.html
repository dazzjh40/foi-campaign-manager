<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list: FOI Director</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0d0b; --text:#f2efe6; --text-soft:rgba(242,239,230,.62);
    --accent:#2f6a4e; --accent-hover:#367a5a; --accent-text:#74c39c; --on-accent:#f2efe6;
    --line:rgba(255,255,255,.16);
    --font-sans:"Inter","Helvetica Neue",Arial,sans-serif;
    --font-serif:"Newsreader",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
       font-family:var(--font-sans);-webkit-font-smoothing:antialiased;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{max-width:460px}
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.06em;
         text-transform:uppercase;color:var(--text-soft);border:1px solid var(--line);
         border-left:3px solid var(--accent-text);border-radius:2px;padding:6px 12px;margin-bottom:22px}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-text)}
  h1{font-family:var(--font-serif);font-size:40px;font-weight:600;letter-spacing:-.015em;line-height:1.05;margin:0 0 14px}
  p{font-size:16px;line-height:1.6;color:var(--text-soft);margin:0 0 28px}
  a.btn{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:600;
        font-size:14px;padding:12px 24px;border-radius:3px;text-decoration:none;transition:background .15s}
  a.btn:hover{background:var(--accent-hover)}
  @media(max-width:600px){h1{font-size:32px}}
</style>
</head>
<body>
  <div class="box">
    <span class="badge"><span class="dot"></span>Waitlist</span>
    <h1>You&rsquo;re on the list.</h1>
    <p>Thanks for signing up. We&rsquo;ll email you the moment the FOI Director platform opens. Need data sooner? Just reply and we&rsquo;ll run a campaign for you.</p>
    <a class="btn" href="index.html">&larr; Back to FOI Director</a>
  </div>
</body>
</html>
